{% extends "store/layout.html" %}

{% block title %}Add New Batch{% endblock %}

{% block content %}
<section class="form-section">
    <div class="form-card">
        <h1>Add New Batch</h1>

        <form class="medical-form" action="{% url 'add' %}" method="post">
            {% csrf_token %}

            <div class="form-grid">
                <div class="form-field full">
                    <label for="item_id">Select item</label>
                    <div class="select-wrap">
                        <select id="item_id" name="item_id" required>
                            <option value="" disabled selected>-- Select an item --</option>
                            {% for item in items %}
                                <option value="{{ item.id }}">{{ item.name }}</option>
                            {% empty %}
                                <option value="" disabled>No items available yet</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="form-field">
                    <label for="quantity">Quantity</label>
                    <input id="quantity" type="number" name="quantity" min="1" placeholder="Enter batch quantity" required>
                </div>

                <div class="form-field">
                    <label for="expiry_date">Expiry date</label>
                    <input id="expiry_date" type="date" name="expiry_date" required>
                </div>
            </div>

            <button type="submit" class="primary-btn">Add Batch</button>
        </form>
    </div>
</section>
{% endblock %}
