{% extends "store/layout.html" %}

{% block title %}Sign In - Times Medical{% endblock %}

{% block content %}
<section class="form-section login-section">
  <div class="form-card login-card">
    <div style="text-align: center; margin-bottom: 24px;">
      <div class="brand-mark" style="margin: 0 auto 12px; width: 48px; height: 48px; font-size: 1.2rem;">TM</div>
      <h1 style="font-size: 1.8rem; margin: 0 0 6px;">Staff Sign In</h1>
      <p style="color: var(--muted); font-size: 0.9rem; margin: 0;">Access Times Medical Portal</p>
    </div>

    <form class="medical-form" method="post" action="{% url 'login' %}">
      {% csrf_token %}

      <div class="form-grid" style="grid-template-columns: 1fr;">
        <div class="form-field full">
          <label for="username">Username</label>
          <input
            id="username"
            type="text"
            name="username"
            placeholder="Enter username"
            autocomplete="username"
            required
            autofocus
          />
        </div>

        <div class="form-field full">
          <label for="password">Password</label>
          <input
            id="password"
            type="password"
            name="password"
            placeholder="Enter password"
            autocomplete="current-password"
            required
          />
        </div>
      </div>

      <button type="submit" class="primary-btn" style="width: 100%; margin-top: 8px;">Sign In</button>
    </form>

   
  </div>
</section>
{% endblock %}
